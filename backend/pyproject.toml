[project]
name = "athlete-tracker-backend"
version = "0.1.0"
description = "Single-athlete performance and injury-risk tracking API"
readme = "README.md"
# CLAUDE.md targets Python 3.12. The only interpreter present on this machine is
# 3.11.9, and nothing here uses 3.12-only syntax, so the floor is 3.11 to keep the
# existing .venv usable. Bump to ">=3.12" once a 3.12 interpreter is installed.
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    # zoneinfo (stdlib) has no timezone data of its own on platforms without a
    # system tz database, notably Windows. tzdata supplies it; no code, just
    # the IANA database, maintained by the same packaging authority as the
    # standard library.
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
